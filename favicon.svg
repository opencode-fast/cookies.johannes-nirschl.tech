<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cookie gradients -->
    <radialGradient id="cookieGradient" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f5caa0" />
      <stop offset="45%" stop-color="#d49354" />
      <stop offset="85%" stop-color="#b06b2b" />
      <stop offset="100%" stop-color="#8a4d1a" />
    </radialGradient>
    <radialGradient id="chipGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5a2e17" />
      <stop offset="70%" stop-color="#361708" />
      <stop offset="100%" stop-color="#210c03" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#552c0e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Cookie Base with bite-like organic shape -->
  <g filter="url(#shadow)">
    <path d="M 32 4 
             C 48 3, 59 15, 60 30 
             C 61 46, 49 60, 33 60 
             C 16 60, 4 48, 4 32 
             C 4 16, 17 5, 32 4 Z" 
          fill="url(#cookieGradient)" />
  </g>

  <!-- Cookie texture / cracks -->
  <path d="M 16 22 Q 22 25 24 20" stroke="#a25e22" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 38 46 Q 44 43 47 48" stroke="#a25e22" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 28 35 Q 34 38 36 33" stroke="#8d4e17" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Chocolate chips -->
  <!-- Chip 1 -->
  <ellipse cx="22" cy="18" rx="4.5" ry="3.8" fill="url(#chipGrad)" transform="rotate(-15 22 18)" />
  <circle cx="20.5" cy="16.5" r="1" fill="#804a2c" opacity="0.8" />
  <!-- Chip 2 -->
  <ellipse cx="44" cy="20" rx="5" ry="4.2" fill="url(#chipGrad)" transform="rotate(25 44 20)" />
  <circle cx="42.5" cy="18.5" r="1.2" fill="#804a2c" opacity="0.8" />
  <!-- Chip 3 -->
  <ellipse cx="32" cy="28" rx="5.5" ry="4.5" fill="url(#chipGrad)" transform="rotate(5 32 28)" />
  <circle cx="30" cy="26" r="1.3" fill="#804a2c" opacity="0.8" />
  <!-- Chip 4 -->
  <ellipse cx="18" cy="38" rx="4.2" ry="3.8" fill="url(#chipGrad)" transform="rotate(40 18 38)" />
  <circle cx="16.5" cy="36.5" r="1" fill="#804a2c" opacity="0.8" />
  <!-- Chip 5 -->
  <ellipse cx="45" cy="38" rx="4.8" ry="4.2" fill="url(#chipGrad)" transform="rotate(-20 45 38)" />
  <circle cx="43.5" cy="36.5" r="1.1" fill="#804a2c" opacity="0.8" />
  <!-- Chip 6 -->
  <ellipse cx="32" cy="48" rx="4" ry="3.5" fill="url(#chipGrad)" transform="rotate(10 32 48)" />

  <!-- Little sprinkles / crumbs -->
  <circle cx="12" cy="28" r="1.2" fill="#ff6b8b" />
  <circle cx="40" cy="12" r="1.3" fill="#ffd166" />
  <circle cx="50" cy="30" r="1.2" fill="#48cfad" />
  <circle cx="26" cy="48" r="1.2" fill="#ff6b8b" />
  <circle cx="48" cy="48" r="1.1" fill="#ffd166" />
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Cookie Not Found 🍪</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    .broken-cookie-art {
      width: 160px;
      height: 160px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 12px 20px rgba(85, 44, 14, 0.18));
      animation: float-broken 3s ease-in-out infinite;
    }

    @keyframes float-broken {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
    }

    .error-code-badge {
      display: inline-block;
      background: var(--c-pink-light);
      color: var(--c-pink);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.3rem 1.1rem;
      border-radius: var(--radius-pill);
      margin-bottom: 0.75rem;
      border: 2px dashed var(--c-pink);
    }
  </style>
</head>
<body>
  <canvas id="cookieBgCanvas" aria-hidden="true"></canvas>

  <div class="container not-found-wrap">
    <!-- Broken Cookie SVG Illustration -->
    <svg class="broken-cookie-art" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Broken cookie illustration">
      <defs>
        <radialGradient id="cookieHalf1" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#f8ce9f" />
          <stop offset="60%" stop-color="#cf8c4a" />
          <stop offset="100%" stop-color="#8c5222" />
        </radialGradient>
        <radialGradient id="chip" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#54280f" />
          <stop offset="100%" stop-color="#210c03" />
        </radialGradient>
      </defs>

      <!-- Left Half of Cookie (shifted left and slightly tilted) -->
      <g transform="translate(-4, 0) rotate(-6 60 70)">
        <path d="M 68 15 C 38 15, 18 36, 18 68 C 18 100, 38 121, 68 121 L 68 100 L 62 88 L 70 76 L 63 60 L 69 45 L 64 30 Z"
              fill="url(#cookieHalf1)" />
        <ellipse cx="40" cy="45" rx="6" ry="5" fill="url(#chip)" transform="rotate(-15 40 45)" />
        <ellipse cx="38" cy="85" rx="5.5" ry="4.5" fill="url(#chip)" transform="rotate(30 38 85)" />
        <ellipse cx="52" cy="65" rx="5" ry="4" fill="url(#chip)" />
        <circle cx="28" cy="65" r="2" fill="#ff5b79" />
      </g>

      <!-- Right Half of Cookie (shifted right and tilted opposite) -->
      <g transform="translate(10, 4) rotate(8 75 70)">
        <path d="M 72 15 C 102 15, 122 36, 122 68 C 122 100, 102 121, 72 121 L 72 100 L 66 88 L 74 76 L 67 60 L 73 45 L 68 30 Z"
              fill="url(#cookieHalf1)" />
        <ellipse cx="98" cy="50" rx="6" ry="5" fill="url(#chip)" transform="rotate(20 98 50)" />
        <ellipse cx="95" cy="85" rx="5" ry="4" fill="url(#chip)" transform="rotate(-20 95 85)" />
        <ellipse cx="82" cy="70" rx="5.5" ry="4.5" fill="url(#chip)" />
        <circle cx="108" cy="68" r="2" fill="#2ec4b6" />
      </g>

      <!-- Crumb particles falling below -->
      <circle cx="68" cy="68" r="2.5" fill="#8c5222" />
      <circle cx="74" cy="92" r="3" fill="#cf8c4a" />
      <circle cx="62" cy="112" r="2" fill="#8c5222" />
      <circle cx="80" cy="125" r="2.5" fill="#cf8c4a" />
      <circle cx="58" cy="128" r="1.8" fill="#ffd166" />
    </svg>

    <div class="error-code-badge">404 ERROR</div>
    <h1 class="site-title" style="font-size: 2.4rem; margin-bottom: 0.75rem;">
      Cookie Not Found!
    </h1>
    <p class="site-subtitle" style="margin-bottom: 2rem;">
      Oh crumb! Looks like someone munched this page or it slipped between the couch cushions.
    </p>

    <a href="index.html" class="btn-primary" style="font-size: 1.1rem; padding: 0.85rem 1.8rem;">
      <span>🏠</span> Return to the Cookie Jar
    </a>
  </div>

  <script type="module">
    import { formatRelativeTime } from './js/shared.js';
    // Small background particle effect
    const canvas = document.getElementById('cookieBgCanvas');
    if (canvas && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const ctx = canvas.getContext('2d');
      const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
      window.addEventListener('resize', resize);
      resize();
      const crumbs = Array.from({ length: 15 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 2 + Math.random() * 4,
        speed: 0.5 + Math.random() * 0.7,
        color: ['#cf8c4a', '#ff5b79', '#2ec4b6', '#ffd166'][Math.floor(Math.random() * 4)]
      }));
      function anim() {
        if (!document.hidden) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (const c of crumbs) {
            c.y += c.speed;
            if (c.y > canvas.height + 10) c.y = -10;
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        requestAnimationFrame(anim);
      }
      requestAnimationFrame(anim);
    }
  </script>
</body>
</html>
